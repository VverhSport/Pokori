<style>
:root{
  --purple:#6C619C; --purple-d:#4D3073; --green:#64B145; --orange:#EF7C00; --ink:#0A0A0D;
  --ink2:#3B3944; --muted:#8C8996; --bg:#EEEEEE; --card:#FFFFFF; --line:#ECEAF1; --soft:#F7F6FA;
  --font:'Unbounded','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--font);color:var(--ink);line-height:1.3;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}

/* Сцена 1280×720, масштабируется под экран */
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;display:flex;flex-direction:column;background:var(--bg)}

/* Шапка */
.hero{position:relative;overflow:hidden;flex:0 0 auto;height:92px;background:var(--purple);color:#fff;display:flex;align-items:center;gap:30px;padding:0 32px}
.hero-mark{position:absolute;right:230px;top:-64px;height:228px;width:auto;aspect-ratio:158/153;pointer-events:none}
.hero-mark .x{fill:#776EA3}
.logo{position:relative;display:block}
.logo svg{display:block;width:132px;height:auto}
.logo-w{color:#fff;--hg:#fff;--hp:#fff;--ho:#fff}
.h-title{position:relative;font-weight:300;text-transform:uppercase;font-size:40px;line-height:1;letter-spacing:-.01em;white-space:nowrap}
.h-right{position:relative;margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.season{background:#fff;color:var(--purple-d);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;border-radius:999px;padding:8px 16px}
.meta{display:inline-flex;gap:8px;align-items:center;font-size:10.5px;background:rgba(255,255,255,.15);border-radius:999px;padding:6px 12px 6px 10px}
.meta .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(100,177,69,.3)}
.meta.err .dot{background:#ff6b6b;box-shadow:0 0 0 3px rgba(255,107,107,.3)}

/* Филиалы */
.bar{flex:0 0 auto;height:58px;display:flex;align-items:center;gap:8px;padding:0 32px}
.tab{display:flex;align-items:center;gap:9px;border:0;cursor:pointer;font-weight:500;font-size:13px;line-height:1;color:var(--ink);background:#fff;border-radius:999px;padding:12px 20px;transition:background .2s,color .2s}
.tab i{width:10px;height:10px;border-radius:3px;transform:rotate(45deg);background:var(--c)}
.tab[aria-selected=true]{background:var(--c);color:#fff}
.tab[aria-selected=true] i{background:#fff}
.legend{margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:300;text-align:right;line-height:1.45}
.legend b{font-weight:500;color:var(--ink2)}

/* Сетка категорий: 3 возраста × 2 пола */
.grid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:12px;padding:0 32px 16px}
.card{background:var(--card);border-radius:18px;padding:11px 14px 6px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.card-h{display:grid;grid-template-columns:1fr 44px 44px 56px;gap:7px;align-items:center;padding-bottom:6px}
.card-h .who{display:flex;align-items:center;gap:8px;min-width:0}
.card-h .lb{font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right}
.age{font-weight:600;font-size:16px}
.g{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:11px;color:#fff;background:var(--c)}
.cnt{font-size:9.5px;color:var(--muted);white-space:nowrap}
.rows{list-style:none}
.row{display:grid;grid-template-columns:26px 1fr 44px 44px 56px;align-items:center;gap:7px;height:26px;border-top:1px solid var(--line)}
.tt{font-size:11.5px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.tt.z{color:#C9C6D1}
.nm{font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pts{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;text-align:right}
.split{display:flex;align-items:center;gap:8px;margin:7px 0 1px;font-size:8.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.split::after{content:"";flex:1;height:1px;background:var(--line)}
.row.solo{height:21px}
.row.solo .tt{font-size:10.5px}
.row.solo .nm{font-size:11.5px;font-weight:400;color:var(--ink2)}
.row.solo .pts{font-size:13px;font-weight:600;color:var(--ink2)}
.card.is-empty{background:transparent;border:1.5px dashed #D6D3DE}
.none{font-size:11px;color:var(--muted);font-weight:300;padding:4px 0}

/* Ромб места */
.place{position:relative;width:26px;height:26px;display:grid;place-items:center;font-weight:600;font-size:10.5px;color:var(--ink2)}
.place::before{content:"";position:absolute;inset:4px;border-radius:6px;transform:rotate(45deg);border:1.5px solid #DEDCE5;background:#fff}
.place span{position:relative}
.place.p1,.place.p2,.place.p3{color:#fff}
.place.p1::before{border:0;background:linear-gradient(135deg,#F6D57A,#D39A2A)}
.place.p2::before{border:0;background:linear-gradient(135deg,#D3D7DE,#959CA8)}
.place.p3::before{border:0;background:linear-gradient(135deg,#E6A877,#B46B38)}
.row.solo .place{width:22px;height:22px;font-size:9px}
.row.solo .place::before{inset:3.5px;border-radius:5px}

.msg{grid-column:1/-1;grid-row:1/-1;display:grid;place-items:center;color:var(--muted);font-size:14px}
</style>
</head>

  SEASON:     {from:'2026-09-01', to:'2026-12-01', label:'Сентябрь — Ноябрь 2026'}, // to — не включая
  TOP:        5,   // сколько показывать в категории в режиме «Топ»
  REFRESH_MIN:2,   // автообновление, минут
  SHOW_PATRONYMIC:false,
};
/* ======================= */

const BRANCHES = [
  {id:'galaktika', name:'Галактика',       full:'ТРК «Галактика»',      addr:'ул. Уральская, 98/11',     color:'#4D3073', re:/галакт/},
  {id:'skazka',    name:'Сказка',          full:'ТЦ «Сказка»',          addr:'ул. Шоссе Нефтяников, 42', color:'#64B145', re:/сказк/},
  {id:'krasnaya',  name:'Красная площадь', full:'МЦ «Красная площадь»', addr:'ул. Дзержинского, 100',    color:'#EF7C00', re:/красн/},
];
const BR = Object.fromEntries(BRANCHES.map(b => [b.id, b]));
const AGES = [
  {id:'u10', label:'До 10',  short:'До 10'},
  {id:'u14', label:'11–14',  short:'11–14'},
  {id:'u15', label:'15+',    short:'15+'},
];
const AGE = Object.fromEntries(AGES.map(a => [a.id, a]));
const GENDERS = ['Ж','М'];
const TRACKS = ['Трасса 1','Трасса 2'];

const state = {tab:null, userTab:false, mode:{}, age:'all', q:'', D:null, updated:null, error:null};

/* ---------- утилиты ---------- */
const norm = s => String(s ?? '').toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim();
const esc  = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sec  = v => (Math.round(v*100)/100).toFixed(2).replace('.', ',');
function plural(n, f){ const a=Math.abs(n)%100, b=a%10; return f[(a>10&&a<20)?2:(b===1?0:(b>=2&&b<=4?1:2))]; }
const people = n => `${n} ${plural(n,['участник','участника','участников'])}`;
function titleCase(w){ return w.split('-').map(p => p ? p[0].toUpperCase()+p.slice(1).toLowerCase() : p).join('-'); }
function displayName(raw){
  let w = String(raw).trim().split(/\s+/).filter(Boolean);
  if(!CONFIG.SHOW_PATRONYMIC && w.length > 2) w = w.slice(0,2);
  return w.map(titleCase).join(' ');
}
// ключ человека: без отчества и без учёта порядка слов
const nameKey = v => {
  const w = norm(v).split(' ').filter(Boolean);
  // отчество отбрасываем, только если это последнее из 3+ слов (фамилия тоже бывает на «-вич»)
  if(w.length > 2 && /(ич|в+н+а|ична|оглы|кызы)$/.test(w[w.length-1])) w.pop();
  return w.sort().join(' ');
};
const parseBranch = v => (BRANCHES.find(b => b.re.test(norm(v))) || {}).id || null;

function parseAge(v){
  const s = norm(v);
  if(!s) return null;
  if(/до\s*10|^u?10$|^<\s*10/.test(s)) return 'u10';
  if(/11|подрост/.test(s)) return 'u14';
  if(/15|взрос|старш/.test(s)) return 'u15';
  const n = parseInt(s);
  if(!isFinite(n)) return null;
  return n <= 10 ? 'u10' : n <= 14 ? 'u14' : 'u15';
}
function parseGender(v){
  const s = norm(v);
  if(!s) return null;
  if(s === 'м' || /^(муж|мал|юн|m|male)/.test(s)) return 'М';
  if(s === 'ж' || /^(жен|дев|f|female|w)/.test(s)) return 'Ж';
  return null;
}
function parseTrack(v){
  const m = norm(v).match(/\d+/);
  return m ? `Трасса ${+m[0]}` : null;
}
function parseTime(v){
  if(v == null) return null;
  if(typeof v === 'number') return v > 0 ? v : null;
  let s = String(v).trim().replace(',', '.');
  if(!s) return null;
  if(s.includes(':')){ const p = s.split(':'); const n = (+p[0])*60 + parseFloat(p[1]); return isFinite(n) && n > 0 ? n : null; }
  const n = parseFloat(s);
  return isFinite(n) && n > 0 ? n : null;
}
function parseDate(v){
  if(v instanceof Date) return v;
  const s = String(v ?? '').trim();
  // формат Google Sheets (gviz): Date(2026,8,3,10,15,22) — месяц с нуля
  let m = s.match(/^Date\((\d+),(\d+),(\d+)/);
  if(m) return new Date(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

/* ---------- данные ---------- */
async function fetchSheet(){
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(CONFIG.SHEET_NAME)}`;
  const text = await (await fetch(url, {cache:'no-store'})).text();
  if(text.indexOf('"table"') === -1) throw new Error('Таблица не открыта по ссылке или лист не найден');
  return JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
}

function parseSheet(json){
  const cols = json.table.cols.map(c => norm(c.label || c.id));
  const find = re => cols.findIndex(c => re.test(c));
  const iDate = find(/отметка|дата|timestamp/), iName = find(/фио|спортсмен|участник/);
  const iLoc  = find(/локац|филиал/), iTrack = find(/трасс/), iTime = find(/время/);
  const iCoach = find(/инструктор|тренер/), iG = find(/^пол$|пол\b/), iAge = find(/возраст|категор/);
  const txt = c => c == null ? '' : String(c.f ?? c.v ?? '');
  const raw = c => c == null ? null : (c.v ?? c.f ?? null);
  return (json.table.rows || []).map(r => ({
    date:  raw(r.c[iDate]) ?? txt(r.c[iDate]),
    name:  txt(r.c[iName]),
    loc:   txt(r.c[iLoc]),
    track: txt(r.c[iTrack]),
    time:  iTime >= 0 ? (raw(r.c[iTime]) ?? txt(r.c[iTime])) : null,
    coach: iCoach >= 0 ? txt(r.c[iCoach]) : '',
    g:     iG   >= 0 ? txt(r.c[iG])   : '',
    age:   iAge >= 0 ? txt(r.c[iAge]) : '',
  }));
}

function inSeason(d){
  if(!d) return false;
  const from = parseDate(CONFIG.SEASON.from), to = parseDate(CONFIG.SEASON.to);
  return d >= from && d < to;
}

function build(rows){
  const byKey = new Map();   // участник в рамках филиала: лучшее время на каждой трассе
  let attempts = 0, days = new Set();
  for(const r of rows){
    const name = String(r.name || '').trim();
    const t = parseTime(r.time), track = parseTrack(r.track), branch = parseBranch(r.loc);
    const d = parseDate(r.date);
    if(!name || !t || !track || !branch || !inSeason(d)) continue;
    const g = parseGender(r.g), age = parseAge(r.age);
    const key = branch + '|' + nameKey(name);
    let a = byKey.get(key);
    if(!a) byKey.set(key, a = {key, name:displayName(name), branch, coach:displayName(r.coach), best:{}, tries:0, dates:new Set(), gv:{}, av:{}});
    a.tries++; attempts++;
    a.dates.add(d.toDateString()); days.add(d.toDateString());
    if(a.best[track] == null || t < a.best[track]) a.best[track] = t;
    a.name = displayName(name);
    if(r.coach) a.coach = displayName(r.coach);
    if(g)   a.gv[g]   = (a.gv[g]   || 0) + 1;   // пол и возраст — по самому частому варианту в записях
    if(age) a.av[age] = (a.av[age] || 0) + 1;
  }
  const top = o => { const e = Object.entries(o); return e.length ? e.sort((x,y) => y[1]-x[1])[0][0] : null; };
  const recs = [];
  for(const a of byKey.values()){
    const t1 = a.best['Трасса 1'] ?? null, t2 = a.best['Трасса 2'] ?? null;
    if(t1 == null && t2 == null) continue;
    const both = t1 != null && t2 != null;
    recs.push({key:a.key, name:a.name, branch:a.branch, coach:a.coach, t1, t2, both,
      total: both ? (t1 + t2)/2 : (t1 ?? t2),
      g: top(a.gv), age: top(a.av), tries:a.tries, days:a.dates.size});
  }
  // места: отдельно в основном зачёте (обе трассы) и в зачёте одной трассы
  const groups = {};
  recs.forEach(r => (groups[[r.branch, r.age, r.g].join('|')] ||= []).push(r));
  for(const g of Object.values(groups)){
    for(const flag of [true, false]){
      const list = g.filter(r => r.both === flag).sort((a,b) => a.total - b.total || a.name.localeCompare(b.name,'ru'));
      list.forEach((r,i) => { r.place = (i && r.total === list[i-1].total) ? list[i-1].place : i + 1; });
    }
  }
  return {recs, attempts, days:days.size};
}

async function load(){
  try{
    state.D = build(parseSheet(await fetchSheet()));
    state.updated = new Date(); state.error = null;
  }catch(e){
    state.error = e.message || String(e); console.warn('Таблица:', e);
    if(!state.D) state.D = {recs:[], attempts:0, days:0};
  }
  render();
}


/* ---------- табло ---------- */
const MAX_BOTH = 5;   // строк основного зачёта в карточке
const MAX_SOLO = 3;   // строк зачёта одной трассы (больше, если основных меньше 5)

const placeBadge = p => `<span class="place${p<=3?' p'+p:''}"><span>${p}</span></span>`;
const byCat = (list, age, g, both) => list.filter(r => r.age === age && r.g === g && r.both === both)
  .sort((x,y) => x.place - y.place || x.name.localeCompare(y.name,'ru'));

function cardHtml(list, age, g){
  const both = byCat(list, age, g, true), solo = byCat(list, age, g, false);
  const n = both.length + solo.length;
  const head = `<header class="card-h"><span class="who"><span class="age">${AGE[age].label}</span><span class="g" style="--c:${g==='Ж'?'#EF7C00':'#6C619C'}">${g}</span>${n ? `<span class="cnt">${people(n)}</span>` : ''}</span>`
             + (n ? `<span class="lb">Т1</span><span class="lb">Т2</span><span class="lb">Итог</span>` : '') + `</header>`;
  if(!n) return `<article class="card is-empty">${head}<p class="none">Пока нет результатов</p></article>`;
  const topBoth = both.slice(0, MAX_BOTH);
  const topSolo = solo.slice(0, MAX_SOLO + Math.max(0, MAX_BOTH - topBoth.length));
  const tt = v => `<span class="tt${v==null?' z':''}">${v==null?'—':sec(v)}</span>`;
  const row = (r, cls) => `<li class="row${cls}">${placeBadge(r.place)}<span class="nm">${esc(r.name)}</span>${tt(r.t1)}${tt(r.t2)}<b class="pts">${sec(r.total)}</b></li>`;
  return `<article class="card">${head}
    ${topBoth.length ? `<ol class="rows">${topBoth.map(r => row(r,'')).join('')}</ol>` : `<p class="none">В зачёте двух трасс пока никого</p>`}
    ${topSolo.length ? `<div class="split">Одна трасса</div><ol class="rows">${topSolo.map(r => row(r,' solo')).join('')}</ol>` : ''}
  </article>`;
}

function renderTabs(){
  document.getElementById('tabs').innerHTML = BRANCHES.map(b =>
    `<button class="tab" role="tab" style="--c:${b.color}" data-tab="${b.id}" aria-selected="${state.tab===b.id}"><i></i>${b.full}</button>`).join('');
}

function renderGrid(){
  const el = document.getElementById('grid');
  if(!state.D){ el.innerHTML = '<div class="msg">Загружаем результаты…</div>'; return; }
  const list = state.D.recs.filter(r => r.branch === state.tab);
  let html = '';
  for(const g of GENDERS) for(const a of AGES) html += cardHtml(list, a.id, g);
  el.innerHTML = html;
}

function renderMeta(){
  const m = document.getElementById('meta'), D = state.D;
  const t = state.updated ? state.updated.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}) : '';
  const n = D ? D.recs.filter(r => r.branch === state.tab).length : 0;
  m.className = 'meta' + (state.error ? ' err' : '');
  m.innerHTML = `<span class="dot"></span><span>${!D ? 'Загружаем результаты…' : state.error ? 'Нет связи с таблицей' : `Обновлено в ${t} · ${people(n)}`}</span>`;
  document.getElementById('season').textContent = CONFIG.SEASON.label;
}

function render(){
  if(!BR[state.tab]) state.tab = BR[location.hash.slice(1)] ? location.hash.slice(1) : BRANCHES[0].id;
  renderTabs(); renderGrid(); renderMeta();
}

function setTab(id){
  if(!BR[id]) return;
  state.tab = id;
  if(location.hash.slice(1) !== id) history.replaceState(null, '', location.pathname + location.search + '#' + id);
  render();
}

/* масштаб сцены 1280×720 под любой экран телевизора */
function fit(){
  const s = Math.min(innerWidth / 1280, innerHeight / 720);
  const st = document.getElementById('stage');
  st.style.transform = `scale(${s})`;
  st.style.left = Math.max(0, (innerWidth - 1280 * s) / 2) + 'px';
  st.style.top  = Math.max(0, (innerHeight - 720 * s) / 2) + 'px';
}

document.addEventListener('click', e => { const t = e.target.closest('[data-tab]'); if(t) setTab(t.dataset.tab); });
window.addEventListener('hashchange', () => setTab(location.hash.slice(1)));
window.addEventListener('resize', fit);

fit();
render();
load();
setInterval(load, CONFIG.REFRESH_MIN * 60000);
</script>
</body>
</html>
