<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --purple:#6C619C; --purple-d:#4D3073; --green:#64B145; --orange:#EF7C00; --ink:#0A0A0D;
  --ink2:#3B3944; --muted:#8C8996; --bg:#EEEEEE; --card:#FFFFFF; --line:#ECEAF1; --soft:#F7F6FA;
  --r:22px; --font:'Unbounded','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.35;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
@media(min-width:720px){.wrap{padding:0 28px}}

/* Шапка */
.hero{position:relative;overflow:hidden;background:var(--purple);color:#fff;padding:26px 0 34px}
.hero-mark{position:absolute;right:10px;top:12px;width:200px;height:194px;pointer-events:none}
.hero-mark .x{fill:#776EA3}
@media(min-width:720px){.hero{padding:34px 0 46px}.hero-mark{right:2%;top:-60px;height:calc(100% + 120px);width:auto;aspect-ratio:158/153}}
.hero-in{position:relative}
.logo{display:inline-block}
.logo svg{display:block;width:118px;height:auto}
@media(min-width:720px){.logo svg{width:150px}}
.logo-w{color:#fff;--hg:#fff;--hp:#fff;--ho:#fff}
h1{font-weight:300;text-transform:uppercase;font-size:clamp(30px,7.4vw,70px);line-height:.98;letter-spacing:-.01em;margin:140px 0 14px}
@media(min-width:720px){h1{margin-top:64px}}
.lead{font-weight:300;font-size:clamp(12px,1.5vw,15px);opacity:.92;max-width:44ch}
.meta{margin-top:20px;display:inline-flex;gap:9px;align-items:center;font-size:11.5px;background:rgba(255,255,255,.15);border-radius:999px;padding:8px 14px 8px 12px}
.meta .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(100,177,69,.28)}
.meta.err .dot{background:#ff6b6b;box-shadow:0 0 0 4px rgba(255,107,107,.28)}

/* Вкладки филиалов */
.tabs-bar{background:var(--bg)}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:14px 0 4px}
.tab{display:flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font-weight:500;font-size:11.5px;line-height:1.15;color:var(--ink);background:#fff;border-radius:999px;padding:13px 8px;transition:background .2s,color .2s,transform .1s;text-align:center}
.tab i{flex:0 0 auto;width:10px;height:10px;border-radius:3px;transform:rotate(45deg);background:var(--c)}
.tab:hover{transform:translateY(-1px)}
.tab[aria-selected=true]{background:var(--c);color:#fff}
.tab[aria-selected=true] i{background:#fff}
@media(min-width:760px){
  .tabs-bar{position:sticky;top:0;z-index:5;background:rgba(238,238,238,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .tabs{display:flex;padding:14px 0}
  .tab{font-size:13px;padding:13px 22px}
  .tab.t-all{margin-left:auto}
}

/* Панель управления */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:18px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid #DEDCE5;background:#fff;border-radius:999px;padding:8px 13px;font-size:11.5px;line-height:1;cursor:pointer;color:var(--ink2);transition:.15s}
.chip i{width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:var(--c)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip[aria-pressed=true] i{background:#fff}
.search{position:relative;flex:1 1 240px;max-width:340px}
.search input{width:100%;border:1px solid #DEDCE5;background:#fff;border-radius:999px;padding:11px 16px 11px 40px;font-size:12px;outline:none}
.search input:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(108,97,156,.15)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}
.seg{display:inline-flex;background:#fff;border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 15px;font-size:11.5px;line-height:1;cursor:pointer;color:var(--ink2);transition:.15s}
.seg button[aria-pressed=true]{background:var(--purple);color:#fff}

/* Заголовок раздела */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:22px 0 4px}
.sec-head h2{display:flex;align-items:center;gap:12px;font-weight:600;font-size:clamp(22px,3.4vw,32px);line-height:1.1}
.dia{flex:0 0 auto;width:16px;height:16px;border-radius:4px;transform:rotate(45deg);background:var(--c)}
.sec-head p{font-size:11.5px;color:var(--muted);margin-top:8px;font-weight:300}
.stat{text-align:right;flex:0 0 auto}
.stat b{display:block;font-size:clamp(24px,3.6vw,34px);font-weight:600;line-height:1;color:var(--c)}
.stat span{font-size:10.5px;color:var(--muted)}
.hint{font-size:11px;color:var(--muted);font-weight:300;margin:6px 0 16px}

/* Плитки */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 4px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:#fff;border-radius:18px;padding:14px 16px;position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;right:-14px;bottom:-14px;width:46px;height:46px;border-radius:10px;transform:rotate(45deg);background:var(--c);opacity:.9}
.tile b{display:block;font-size:24px;font-weight:600;line-height:1.1}
.tile span{font-size:10.5px;color:var(--muted)}

/* Карточки категорий */
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border-radius:var(--r);padding:16px 18px 8px;display:flex;flex-direction:column}
.card-h{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.age{font-weight:600;font-size:17px}
.g{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;color:#fff;background:var(--c)}
.cnt{margin-left:auto;font-size:10.5px;color:var(--muted)}
.rows{list-style:none}
.row{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.nm{font-weight:500;font-size:13px;line-height:1.25}
.co{font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:300}
.co i{display:inline-block;width:7px;height:7px;border-radius:2px;transform:rotate(45deg);background:var(--c);margin:0 6px 0 1px;vertical-align:1px}
.pts{font-weight:700;font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.pts small{display:block;font-size:9px;font-weight:300;color:var(--muted);margin-top:2px;letter-spacing:.02em}
.tt{display:none;text-align:right;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.tt.z{color:#C9C6D1}
.cols{display:none}
.tt-in b{font-weight:500;color:var(--ink2)}
@media(min-width:760px){
  .row{grid-template-columns:36px 1fr 58px 58px 72px}
  .tt{display:block}
  .tt-in{display:none}
  .pts small{display:none}
  .cols{display:grid;grid-template-columns:1fr 58px 58px 72px;gap:12px;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:0 0 6px}
}
.card.is-empty{background:transparent;border:1.5px dashed #D6D3DE}
.none{font-size:11.5px;color:var(--muted);padding:6px 0 14px;font-weight:300}
.split{display:flex;align-items:center;gap:9px;margin:10px 0 2px;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:400}
.split::after{content:"";flex:1;height:1px;background:var(--line)}
.row.solo .nm{font-weight:400}
.row.solo .pts{font-size:15px;font-weight:600;color:var(--ink2)}
.more{margin:8px 0 6px;align-self:flex-start;border:0;background:var(--soft);border-radius:999px;padding:8px 13px;font-size:10.5px;color:var(--ink2);cursor:pointer}
.more:hover{background:#EEECF4}

/* Ромб места */
.place{position:relative;width:34px;height:34px;display:grid;place-items:center;font-weight:600;font-size:12px;color:var(--ink2)}
.place::before{content:"";position:absolute;inset:5px;border-radius:7px;transform:rotate(45deg);border:1.5px solid #DEDCE5;background:#fff}
.place span{position:relative}
.place.p1,.place.p2,.place.p3{color:#fff}
.place.p1::before{border:0;background:linear-gradient(135deg,#F6D57A,#D39A2A)}
.place.p2::before{border:0;background:linear-gradient(135deg,#D3D7DE,#959CA8)}
.place.p3::before{border:0;background:linear-gradient(135deg,#E6A877,#B46B38)}
.place.sm{width:30px;height:30px;font-size:11px}

/* Таблица-протокол */
.cat{background:#fff;border-radius:var(--r);margin:14px 0;overflow:hidden}
.cat-h{display:flex;align-items:center;gap:10px;padding:15px 18px 12px}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:11.5px}
th{font-weight:500;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:center;padding:9px 6px;background:var(--soft);white-space:nowrap}
td{padding:8px 6px;border-top:1px solid var(--line);text-align:center;white-space:nowrap;background:#fff;font-variant-numeric:tabular-nums}
.c-pl{position:sticky;left:0;z-index:1;width:62px;min-width:62px;max-width:62px;padding-left:12px}
.c-nm{position:sticky;left:62px;z-index:1;text-align:left;min-width:150px;max-width:220px;white-space:normal;box-shadow:6px 0 8px -8px rgba(0,0,0,.25)}
th.c-nm{text-align:left}
.c-br{text-align:left;font-size:10.5px;color:var(--ink2)}
.c-br i{display:inline-block;width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:var(--c);margin-right:8px;vertical-align:1px}
.c-t{min-width:62px;color:var(--ink2)}
.c-t.z{color:#C9C6D1}
.c-sum{position:sticky;right:0;z-index:1;font-weight:700;font-size:14px;padding-right:16px;min-width:70px;box-shadow:-6px 0 8px -8px rgba(0,0,0,.25)}
th.c-pl,th.c-nm,th.c-sum{background:var(--soft)}
th.c-sum{font-size:9.5px;font-weight:500;color:var(--ink2)}
tbody tr:hover td{background:#FBFAFD}
tbody tr.solo td{color:var(--ink2)}
tbody tr.solo .c-sum{font-weight:600}
.sub-h td{background:var(--soft);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:7px 12px}
@media(max-width:759px){.c-nm{min-width:128px;max-width:150px}.c-nm .nm{font-size:11.5px}.c-nm .co{font-size:9.5px}.c-sum{min-width:60px;padding-right:12px;font-size:13px}.c-t{min-width:56px}}
@media(min-width:760px){.c-nm{min-width:210px;max-width:280px}}
.tab .long{display:none}
@media(min-width:760px){.tab .long{display:inline}}

/* Регламент */
.rules{background:#fff;border-radius:var(--r);padding:20px 18px;margin:16px 0 0}
@media(min-width:760px){.rules{padding:26px 28px}}
.rules h3{display:flex;align-items:center;gap:11px;font-weight:600;font-size:17px;margin-bottom:14px}
.rules h3 .dia{width:13px;height:13px}
.rules-grid{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:620px){.rules-grid{grid-template-columns:1fr 1fr}}
@media(min-width:980px){.rules-grid{grid-template-columns:repeat(3,1fr)}}
.rule{background:var(--soft);border-radius:16px;padding:13px 15px}
.rule b{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:400;margin-bottom:5px}
.rule span{font-size:12px;font-weight:400;line-height:1.4}
.noms{display:grid;gap:10px;grid-template-columns:1fr;margin-top:10px}
@media(min-width:620px){.noms{grid-template-columns:1fr 1fr}}
.nom{border-radius:16px;padding:14px 16px;background:var(--soft);border-left:5px solid var(--c)}
.nom b{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px}
.nom span{font-size:11px;color:var(--muted);font-weight:300;line-height:1.45}

/* Сообщения / подвал */
.notice{background:#fff;border-radius:18px;padding:14px 16px;margin:18px 0 0;font-size:11.5px;line-height:1.5;color:var(--ink2);border-left:5px solid var(--orange)}
.notice.err{border-left-color:#E5484D}
.empty{background:#fff;border-radius:var(--r);padding:34px 20px;text-align:center;color:var(--muted);font-size:12px;margin:14px 0}
.loading{padding:60px 0;text-align:center;color:var(--muted);font-size:12px}
.foot{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between;padding-top:36px;padding-bottom:40px;font-size:11px;color:var(--muted)}
.foot .logo svg{width:104px}
.foot a{color:inherit}
.addr{display:flex;flex-wrap:wrap;gap:8px 18px}
.addr span{display:inline-flex;align-items:center;gap:8px}
.addr i{width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:var(--c)}
</style>
</head>
<body>

<script>
/* ====== НАСТРОЙКИ ====== */
const CONFIG = {
  SHEET_ID:   '1p0xuq0ezPj2FFDcLaaQVlSkROdMIjipY48gePkJbPFc', // таблица «Скорость»
  SHEET_NAME: 'Form_Responses',                                // лист с ответами формы
  SEASON:     {from:'2026-09-01', to:'2026-12-01', label:'Сентябрь — Ноябрь 2026'}, // to — не включая
  TOP:        5,   // сколько показывать в категории в режиме «Топ»
  REFRESH_MIN:2,   // автообновление, минут
  SHOW_PATRONYMIC:false,
};
/* ======================= */

const BRANCHES = [
  {id:'galaktika', name:'Галактика',       full:'ТРК «Галактика»',      addr:'ул. Уральская, 98/11',     color:'#4D3073', re:/галакт/},
  {id:'skazka',    name:'Сказка',          full:'ТЦ «Сказка»',          addr:'ул. Шоссе Нефтяников, 42', color:'#64B145', re:/сказк/},
  {id:'krasnaya',  name:'Красная площадь', full:'МЦ «Красная площадь»', addr:'ул. Дзержинского, 100',    color:'#EF7C00', re:/красн/},
];
const BR = Object.fromEntries(BRANCHES.map(b => [b.id, b]));
const AGES = [
  {id:'u10', label:'До 10',  short:'До 10'},
  {id:'u14', label:'11–14',  short:'11–14'},
  {id:'u15', label:'15+',    short:'15+'},
];
const AGE = Object.fromEntries(AGES.map(a => [a.id, a]));
const GENDERS = ['Ж','М'];
const TRACKS = ['Трасса 1','Трасса 2'];

const state = {tab:null, userTab:false, mode:{}, age:'all', q:'', D:null, updated:null, error:null};

/* ---------- утилиты ---------- */
const norm = s => String(s ?? '').toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim();
const esc  = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sec  = v => (Math.round(v*100)/100).toFixed(2).replace('.', ',');
function plural(n, f){ const a=Math.abs(n)%100, b=a%10; return f[(a>10&&a<20)?2:(b===1?0:(b>=2&&b<=4?1:2))]; }
const people = n => `${n} ${plural(n,['участник','участника','участников'])}`;
function titleCase(w){ return w.split('-').map(p => p ? p[0].toUpperCase()+p.slice(1).toLowerCase() : p).join('-'); }
function displayName(raw){
  let w = String(raw).trim().split(/\s+/).filter(Boolean);
  if(!CONFIG.SHOW_PATRONYMIC && w.length > 2) w = w.slice(0,2);
  return w.map(titleCase).join(' ');
}
// ключ человека: без отчества и без учёта порядка слов
const nameKey = v => {
  const w = norm(v).split(' ').filter(Boolean);
  // отчество отбрасываем, только если это последнее из 3+ слов (фамилия тоже бывает на «-вич»)
  if(w.length > 2 && /(ич|в+н+а|ична|оглы|кызы)$/.test(w[w.length-1])) w.pop();
  return w.sort().join(' ');
};
const parseBranch = v => (BRANCHES.find(b => b.re.test(norm(v))) || {}).id || null;

function parseAge(v){
  const s = norm(v);
  if(!s) return null;
  if(/до\s*10|^u?10$|^<\s*10/.test(s)) return 'u10';
  if(/11|подрост/.test(s)) return 'u14';
  if(/15|взрос|старш/.test(s)) return 'u15';
  const n = parseInt(s);
  if(!isFinite(n)) return null;
  return n <= 10 ? 'u10' : n <= 14 ? 'u14' : 'u15';
}
function parseGender(v){
  const s = norm(v);
  if(!s) return null;
  if(s === 'м' || /^(муж|мал|юн|m|male)/.test(s)) return 'М';
  if(s === 'ж' || /^(жен|дев|f|female|w)/.test(s)) return 'Ж';
  return null;
}
function parseTrack(v){
  const m = norm(v).match(/\d+/);
  return m ? `Трасса ${+m[0]}` : null;
}
function parseTime(v){
  if(v == null) return null;
  if(typeof v === 'number') return v > 0 ? v : null;
  let s = String(v).trim().replace(',', '.');
  if(!s) return null;
  if(s.includes(':')){ const p = s.split(':'); const n = (+p[0])*60 + parseFloat(p[1]); return isFinite(n) && n > 0 ? n : null; }
  const n = parseFloat(s);
  return isFinite(n) && n > 0 ? n : null;
}
function parseDate(v){
  if(v instanceof Date) return v;
  const s = String(v ?? '').trim();
  // формат Google Sheets (gviz): Date(2026,8,3,10,15,22) — месяц с нуля
  let m = s.match(/^Date\((\d+),(\d+),(\d+)/);
  if(m) return new Date(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

/* ---------- данные ---------- */
async function fetchSheet(){
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(CONFIG.SHEET_NAME)}`;
  const text = await (await fetch(url, {cache:'no-store'})).text();
  if(text.indexOf('"table"') === -1) throw new Error('Таблица не открыта по ссылке или лист не найден');
  return JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
}

function parseSheet(json){
  const cols = json.table.cols.map(c => norm(c.label || c.id));
  const find = re => cols.findIndex(c => re.test(c));
  const iDate = find(/отметка|дата|timestamp/), iName = find(/фио|спортсмен|участник/);
  const iLoc  = find(/локац|филиал/), iTrack = find(/трасс/), iTime = find(/время/);
  const iCoach = find(/инструктор|тренер/), iG = find(/^пол$|пол\b/), iAge = find(/возраст|категор/);
  const txt = c => c == null ? '' : String(c.f ?? c.v ?? '');
  const raw = c => c == null ? null : (c.v ?? c.f ?? null);
  return (json.table.rows || []).map(r => ({
    date:  raw(r.c[iDate]) ?? txt(r.c[iDate]),
    name:  txt(r.c[iName]),
    loc:   txt(r.c[iLoc]),
    track: txt(r.c[iTrack]),
    time:  iTime >= 0 ? (raw(r.c[iTime]) ?? txt(r.c[iTime])) : null,
    coach: iCoach >= 0 ? txt(r.c[iCoach]) : '',
    g:     iG   >= 0 ? txt(r.c[iG])   : '',
    age:   iAge >= 0 ? txt(r.c[iAge]) : '',
  }));
}

function inSeason(d){
  if(!d) return false;
  const from = parseDate(CONFIG.SEASON.from), to = parseDate(CONFIG.SEASON.to);
  return d >= from && d < to;
}

function build(rows){
  const byKey = new Map();   // участник в рамках филиала: лучшее время на каждой трассе
  let attempts = 0, days = new Set();
  for(const r of rows){
    const name = String(r.name || '').trim();
    const t = parseTime(r.time), track = parseTrack(r.track), branch = parseBranch(r.loc);
    const d = parseDate(r.date);
    if(!name || !t || !track || !branch || !inSeason(d)) continue;
    const g = parseGender(r.g), age = parseAge(r.age);
    const key = branch + '|' + nameKey(name);
    let a = byKey.get(key);
    if(!a) byKey.set(key, a = {key, name:displayName(name), branch, coach:displayName(r.coach), best:{}, tries:0, dates:new Set(), gv:{}, av:{}});
    a.tries++; attempts++;
    a.dates.add(d.toDateString()); days.add(d.toDateString());
    if(a.best[track] == null || t < a.best[track]) a.best[track] = t;
    a.name = displayName(name);
    if(r.coach) a.coach = displayName(r.coach);
    if(g)   a.gv[g]   = (a.gv[g]   || 0) + 1;   // пол и возраст — по самому частому варианту в записях
    if(age) a.av[age] = (a.av[age] || 0) + 1;
  }
  const top = o => { const e = Object.entries(o); return e.length ? e.sort((x,y) => y[1]-x[1])[0][0] : null; };
  const recs = [];
  for(const a of byKey.values()){
    const t1 = a.best['Трасса 1'] ?? null, t2 = a.best['Трасса 2'] ?? null;
    if(t1 == null && t2 == null) continue;
    const both = t1 != null && t2 != null;
    recs.push({key:a.key, name:a.name, branch:a.branch, coach:a.coach, t1, t2, both,
      total: both ? (t1 + t2)/2 : (t1 ?? t2),
      g: top(a.gv), age: top(a.av), tries:a.tries, days:a.dates.size});
  }
  // места: отдельно в основном зачёте (обе трассы) и в зачёте одной трассы
  const groups = {};
  recs.forEach(r => (groups[[r.branch, r.age, r.g].join('|')] ||= []).push(r));
  for(const g of Object.values(groups)){
    for(const flag of [true, false]){
      const list = g.filter(r => r.both === flag).sort((a,b) => a.total - b.total || a.name.localeCompare(b.name,'ru'));
      list.forEach((r,i) => { r.place = (i && r.total === list[i-1].total) ? list[i-1].place : i + 1; });
    }
  }
  return {recs, attempts, days:days.size};
}

async function load(){
  try{
    state.D = build(parseSheet(await fetchSheet()));
    state.updated = new Date(); state.error = null;
  }catch(e){
    state.error = e.message || String(e); console.warn('Таблица:', e);
    if(!state.D) state.D = {recs:[], attempts:0, days:0};
  }
  render();
}

/* ---------- отрисовка ---------- */
function tabs(){
  return [...BRANCHES.map(b => ({id:b.id, name:b.name, long:'', color:b.color})),
          {id:'all', name:'Все филиалы', long:'', color:'#0A0A0D'}];
}
const modeOf = tab => state.mode[tab] || 'top';
const listOf = () => state.tab === 'all' ? state.D.recs : state.D.recs.filter(r => r.branch === state.tab);

function renderTabs(){
  const el = document.getElementById('tabs'), list = tabs();
  el.innerHTML = list.map(t =>
    `<button class="tab${t.id==='all'?' t-all':''}" role="tab" style="--c:${t.color}" data-tab="${t.id}" aria-selected="${state.tab===t.id}"><i></i><span>${t.name}</span></button>`).join('');
}

function renderToolbar(){
  const mode = modeOf(state.tab);
  const modes = [['top',`Топ-${CONFIG.TOP}`], ['table','Протокол']];
  document.getElementById('toolbar').innerHTML = `
    <div class="seg" role="group" aria-label="Вид">${modes.map(([m,l]) => `<button data-mode="${m}" aria-pressed="${mode===m}">${l}</button>`).join('')}</div>
    ${mode === 'table' ? `<label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Фамилия участника или инструктора" value="${esc(state.q)}" autocomplete="off"></label>` : ''}
    <div class="chips" aria-label="Возраст">${['all',...AGES.map(a=>a.id)].map(a =>
      `<button class="chip" data-age="${a}" aria-pressed="${state.age===a}">${a==='all'?'Все возрасты':AGE[a].short}</button>`).join('')}</div>`;
}

const agesIn = () => state.age === 'all' ? AGES.map(a => a.id) : [state.age];
const byCat = (list, age, g, both) => list.filter(r => r.age === age && r.g === g && r.both === both)
  .sort((x,y) => x.place - y.place || x.name.localeCompare(y.name,'ru'));
const placeBadge = (p, sm) => `<span class="place${sm?' sm':''}${p<=3?' p'+p:''}"><span>${p}</span></span>`;
function subline(r){
  const b = BR[r.branch];
  const parts = [];
  if(state.tab === 'all' && b) parts.push(`<i style="--c:${b.color}"></i>${b.name}`);
  if(r.coach) parts.push(esc(r.coach));
  return parts.join(' · ');
}

/* Топ: карточки Ж/М по возрастам */
function cardsView(list){
  let html = '';
  for(const age of agesIn()){
    for(const g of GENDERS){
      const both = byCat(list, age, g, true), solo = byCat(list, age, g, false);
      if(state.age === 'all' && !both.length && !solo.length) continue;
      const head = `<header class="card-h"><span class="age">${AGE[age].label}</span><span class="g" style="--c:${g==='Ж'?'#EF7C00':'#6C619C'}">${g}</span>`;
      if(!both.length && !solo.length){ html += `<article class="card is-empty">${head}</header><p class="none">Пока нет результатов</p></article>`; continue; }
      const tt = v => `<span class="tt${v==null?' z':''}">${v==null?'—':sec(v)}</span>`;
      const rowHtml = (r, cls) => `<li class="row${cls}">${placeBadge(r.place)}
        <div><div class="nm">${esc(r.name)}</div>${subline(r)?`<div class="co">${subline(r)}</div>`:''}<div class="co tt-in">Т1 <b>${r.t1==null?'—':sec(r.t1)}</b> · Т2 <b>${r.t2==null?'—':sec(r.t2)}</b></div></div>
        ${tt(r.t1)}${tt(r.t2)}<b class="pts">${sec(r.total)}<small>${r.both?'итог':'1 трасса'}</small></b></li>`;
      const topBoth = both.slice(0, CONFIG.TOP), topSolo = solo.slice(0, CONFIG.TOP);
      html += `<article class="card">${head}<span class="cnt">${people(both.length + solo.length)}</span></header>
        <div class="cols"><span></span><span>Т1</span><span>Т2</span><span>Итог</span></div>
        ${topBoth.length ? `<ol class="rows">${topBoth.map(r => rowHtml(r,'')).join('')}</ol>` : `<p class="none">В зачёте двух трасс пока никого</p>`}
        ${topSolo.length ? `<div class="split">Одна трасса</div><ol class="rows">${topSolo.map(r => rowHtml(r,' solo')).join('')}</ol>` : ''}
        ${(both.length > topBoth.length || solo.length > topSolo.length) ? `<button class="more" data-more="${age}">Все ${both.length + solo.length} →</button>` : ''}</article>`;
    }
  }
  return html ? `<div class="grid">${html}</div>` : `<div class="empty">${list.length ? 'Под выбранные фильтры результатов нет' : 'Результатов пока нет'}</div>`;
}

/* Протокол: таблица с обеими трассами */
function tablesView(list){
  const q = norm(state.q);
  const f = list.filter(r => !q || norm(r.name).includes(q) || norm(r.coach).includes(q));
  let html = '';
  for(const age of agesIn()) for(const g of GENDERS){
    const both = byCat(f, age, g, true), solo = byCat(f, age, g, false);
    if(!both.length && !solo.length) continue;
    const tr = (r, cls) => { const b = BR[r.branch]; return `<tr class="${cls}">
      <td class="c-pl">${placeBadge(r.place, true)}</td>
      <td class="c-nm"><div class="nm">${esc(r.name)}</div>${r.coach?`<div class="co">${esc(r.coach)}</div>`:''}</td>
      <td class="c-br">${b ? `<i style="--c:${b.color}"></i>${b.name}` : '—'}</td>
      <td class="c-t${r.t1==null?' z':''}">${r.t1==null?'—':sec(r.t1)}</td>
      <td class="c-t${r.t2==null?' z':''}">${r.t2==null?'—':sec(r.t2)}</td>
      <td class="c-sum">${sec(r.total)}</td></tr>`; };
    html += `<section class="cat"><header class="cat-h"><span class="age">${AGE[age].label}</span><span class="g" style="--c:${g==='Ж'?'#EF7C00':'#6C619C'}">${g}</span><span class="cnt">${people(both.length + solo.length)}</span></header>
      <div class="tbl"><table><thead><tr><th class="c-pl">Место</th><th class="c-nm">Участник</th><th class="c-br">Филиал</th><th class="c-t">Трасса 1</th><th class="c-t">Трасса 2</th><th class="c-sum">Итог</th></tr></thead>
      <tbody>${both.map(r => tr(r,'')).join('')}
      ${solo.length ? `<tr class="sub-h"><td colspan="6">Одна трасса · отдельный зачёт</td></tr>` + solo.map(r => tr(r,'solo')).join('') : ''}
      </tbody></table></div></section>`;
  }
  return html || `<div class="empty">${list.length ? 'Ничего не найдено' : 'Результатов пока нет'}</div>`;
}

function renderView(){
  const v = document.getElementById('view'), D = state.D;
  if(!D){ v.innerHTML = '<div class="loading">Загружаем результаты…</div>'; return; }
  const mode = modeOf(state.tab), list = listOf(), br = BR[state.tab];
  const color = br ? br.color : '#0A0A0D';
  const tiles = state.tab === 'all'
    ? [{name:'Всего участников', color:'#6C619C', n:list.length},
       ...BRANCHES.map(b => ({name:b.name, color:b.color, n:list.filter(r => r.branch === b.id).length}))]
    : [{name:'Участников', color, n:list.length},
       {name:'В зачёте двух трасс', color:'#6C619C', n:list.filter(r => r.both).length},
       {name:'Только одна трасса', color:'#EF7C00', n:list.filter(r => !r.both).length},
       {name:'Попыток за сезон', color:'#64B145', n:list.reduce((s,r) => s + r.tries, 0)}];
  v.innerHTML = `<div class="sec-head" style="--c:${color}"><div><h2><i class="dia"></i>${br ? br.full : 'Все филиалы'}</h2>
      <p>${CONFIG.SEASON.label} · итог — среднее лучших времён двух трасс</p></div>
      <div class="stat" style="--c:${color}"><b>${list.length}</b><span>${plural(list.length,['участник','участника','участников'])}</span></div></div>
    <div class="tiles">${tiles.map(t => `<div class="tile" style="--c:${t.color}"><b>${t.n}</b><span>${t.name}</span></div>`).join('')}</div>
    <p class="hint">${mode === 'top' ? `Топ-${CONFIG.TOP} в каждой категории · Т1 и Т2 — лучшее время на трассе, итог — среднее двух · кто пробежал одну трассу, идёт отдельным зачётом ниже` : 'Лучшее время на каждой трассе · итог — среднее двух'}</p>
    ${list.length ? (mode === 'top' ? cardsView(list) : tablesView(list)) : `<div class="empty">Результатов сезона пока нет</div>`}`;
}

function renderRules(){
  const rules = [
    ['Период', CONFIG.SEASON.label],
    ['Что засчитывается', 'Лучшая попытка на каждой трассе'],
    ['Итог', 'Среднее лучших времён двух трасс'],
    ['Одна трасса', 'Отдельный зачёт ниже основного'],
    ['Попытки', 'Не ограничены'],
    ['При равенстве', 'Выше тот, кто показал результат раньше'],
  ];
  const noms = [
    ['Рекордсмен филиалов', 'Попал в топ-3 на каждом из трёх филиалов за сезон', '#4D3073'],
    ['Самый активный', 'Больше всего попыток в разные дни за сезон', '#EF7C00'],
  ];
  document.getElementById('rules').innerHTML = `
    <h3><i class="dia" style="--c:#6C619C"></i>Регламент</h3>
    <div class="rules-grid">${rules.map(([b,s]) => `<div class="rule"><b>${b}</b><span>${s}</span></div>`).join('')}</div>
    <h3 style="margin-top:22px"><i class="dia" style="--c:#EF7C00"></i>Специальные номинации</h3>
    <div class="noms">${noms.map(([b,s,c]) => `<div class="nom" style="--c:${c}"><b>${b}</b><span>${s}</span></div>`).join('')}</div>
    <p class="hint" style="margin:14px 0 0">Категории: ${AGES.map(a => a.short).join(' / ')} · мужской и женский зачёт раздельно на каждом филиале.</p>`;
}

function renderMeta(){
  const m = document.getElementById('meta'), D = state.D;
  const t = state.updated ? state.updated.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}) : '';
  m.className = 'meta' + (state.error ? ' err' : '');
  m.innerHTML = `<span class="dot"></span><span>${!D ? 'Загружаем результаты…' : state.error ? 'Нет связи с таблицей' : `Обновлено в ${t} · ${people(D.recs.length)}`}</span>`;
  document.getElementById('notice').innerHTML = state.error
    ? `<div class="notice err">Не удалось загрузить результаты. Проверьте интернет и что таблица открыта по ссылке («Все, у кого есть ссылка — читатель»).</div>` : '';
}

function pickDefaultTab(){
  const h = location.hash.slice(1);
  if(tabs().some(t => t.id === h)) return h;
  return BRANCHES[0].id;
}

function render(){
  if(!state.userTab || !tabs().some(t => t.id === state.tab)) state.tab = pickDefaultTab();
  renderTabs(); renderToolbar(); renderView(); renderRules(); renderMeta();
}

function setTab(id){
  if(!tabs().some(t => t.id === id)) id = pickDefaultTab();
  state.tab = id; state.userTab = true;
  if(location.hash.slice(1) !== id) history.replaceState(null, '', location.pathname + location.search + '#' + id);
  renderTabs(); renderToolbar(); renderView();
}
const scrollToContent = () => window.scrollTo({top: document.querySelector('.hero').offsetHeight, behavior:'smooth'});

/* ---------- события ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if(t) return setTab(t.dataset.tab);
  const md = e.target.closest('[data-mode]');
  if(md){ state.mode[state.tab] = md.dataset.mode; renderToolbar(); return renderView(); }
  const a = e.target.closest('[data-age]');
  if(a){ state.age = a.dataset.age; document.querySelectorAll('[data-age]').forEach(x => x.setAttribute('aria-pressed', x.dataset.age === state.age)); return renderView(); }
  const more = e.target.closest('[data-more]');
  if(more){ state.mode[state.tab] = 'table'; state.age = more.dataset.more; renderToolbar(); renderView(); scrollToContent(); }
});
document.addEventListener('input', e => { if(e.target.id === 'q'){ state.q = e.target.value; renderView(); } });
window.addEventListener('hashchange', () => setTab(location.hash.slice(1)));

document.getElementById('addr').innerHTML = BRANCHES.map(b => `<span style="--c:${b.color}"><i></i>${b.full}, ${b.addr}</span>`).join('');
render();
load();
setInterval(load, CONFIG.REFRESH_MIN * 60000);
</script>
</body>
</html>
